<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1722">
<title>Companion</title>
<style>
:root{--bg:#1b1722;--card:#262031;--me:#7a3b69;--ai:#322a40;--tx:#f3eef7;--mut:#a79bb8;--ac:#e08ab4;--ln:#3a3149}
@media (prefers-color-scheme:light){:root{--bg:#f6f1f8;--card:#fff;--me:#c0568f;--ai:#ebe3f0;--tx:#241c2c;--mut:#6f6380;--ac:#b13d7c;--ln:#ddd2e4}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.45 Georgia,'Times New Roman',serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,textarea,select{font:inherit;color:inherit}
.app{height:100%;display:flex;flex-direction:column;max-width:720px;margin:0 auto}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--ln)}
header h1{font-size:18px;margin:0;flex:1}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:9px 14px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--ln)}
.btn.sm{padding:5px 10px;font-size:14px}
.ava{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--ai);flex:none;display:flex;align-items:center;justify-content:center;font-weight:bold}
.view{flex:1;overflow:auto;padding:14px}
.hide{display:none!important}
.row{display:flex;gap:12px;align-items:center;padding:12px;background:var(--card);border-radius:12px;margin-bottom:10px;cursor:pointer}
.row .t{flex:1;min-width:0}.row small{color:var(--mut);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg{max-width:86%;padding:10px 13px;border-radius:16px;margin:6px 0;white-space:pre-wrap;word-wrap:break-word}
.msg.user{background:var(--me);color:#fff;margin-left:auto;border-bottom-right-radius:4px}
.msg.assistant{background:var(--ai);border-bottom-left-radius:4px}
.tools{display:flex;gap:6px;margin:0 0 4px;font-size:13px}
.tools.r{justify-content:flex-end}
.tools button{background:none;border:0;color:var(--mut);padding:2px 4px;cursor:pointer}
.composer{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--ln)}
.composer textarea{flex:1;resize:none;max-height:120px;background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:9px 12px}
label{display:block;margin:12px 0 4px;color:var(--mut);font-size:14px}
input[type=text],input[type=password],input[type=number],textarea.f,select{width:100%;background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:9px 12px}
textarea.f{min-height:90px}
.hint{color:var(--mut);font-size:13px;margin-top:6px}
.err{color:#ff7a7a;padding:8px 14px}
</style>
</head>
<body>
<div class="app">
  <header>
    <button class="btn ghost sm" id="back" onclick="go('list')">←</button>
    <img class="ava hide" id="hAva" alt="">
    <h1 id="title">Персонажи</h1>
    <button class="btn ghost sm" id="hEdit" onclick="editChar(cur)">Правка</button>
    <button class="btn ghost sm" onclick="go('set')">⚙</button>
  </header>

  <div class="view" id="list">
    <button class="btn" onclick="editChar(null)" style="width:100%;margin-bottom:14px">+ Создать персонажа</button>
    <div id="chars"></div>
    <p class="hint">Приложение для взрослых (18+). Все персонажи вымышленные. Данные хранятся только на этом устройстве.</p>
  </div>

  <div class="view hide" id="chat"></div>
  <div class="err hide" id="err"></div>
  <div class="composer hide" id="comp">
    <textarea id="inp" rows="1" placeholder="Сообщение…"></textarea>
    <button class="btn" id="send" onclick="send()">▶</button>
  </div>

  <div class="view hide" id="edit">
    <div style="display:flex;gap:12px;align-items:center">
      <img class="ava" id="eAva" style="width:72px;height:72px" alt="">
      <label class="btn ghost sm" style="margin:0">Загрузить фото<input type="file" id="eFile" accept="image/*" hidden></label>
    </div>
    <label>Имя</label><input type="text" id="eName">
    <label>Описание и характер (системный промпт)</label><textarea class="f" id="ePrompt" placeholder="Кто она/он, как говорит, как ведёт себя, что любит…"></textarea>
    <label>Сценарий (где вы и что происходит)</label><textarea class="f" id="eScen"></textarea>
    <label>Первое сообщение</label><textarea class="f" id="eFirst"></textarea>
    <div style="display:flex;gap:8px;margin-top:16px">
      <button class="btn" onclick="saveChar()">Сохранить</button>
      <button class="btn ghost" id="eDel" onclick="delChar()">Удалить</button>
      <button class="btn ghost" id="eReset" onclick="resetChat()">Сбросить чат</button>
    </div>
  </div>

  <div class="view hide" id="set">
    <label>Адрес API (OpenAI-совместимый)</label>
    <input type="text" id="sUrl" placeholder="http://192.168.1.10:8080/v1">
    <label>API-ключ (если нужен)</label><input type="password" id="sKey">
    <label>Название модели</label><input type="text" id="sModel" placeholder="например, local-model">
    <label>Температура</label><input type="number" id="sTemp" step="0.1" min="0" max="2">
    <label>Максимум токенов в ответе</label><input type="number" id="sMax" step="50">
    <button class="btn" style="margin-top:16px" onclick="saveSet()">Сохранить</button>
    <p class="hint">Подойдёт любой сервер с OpenAI-форматом: llama.cpp server, Ollama, LM Studio, KoboldCpp, OpenRouter и др. Модель выбираешь сам(а).</p>
  </div>
</div>

<script>
var S={url:'',key:'',model:'',temp:0.9,max:400},chars=[],cur=null,view='list',busy=false;
function load(){try{var a=localStorage.getItem('cc_s');if(a)S=Object.assign(S,JSON.parse(a));var b=localStorage.getItem('cc_c');if(b)chars=JSON.parse(b)}catch(e){}}
function save(){try{localStorage.setItem('cc_s',JSON.stringify(S));localStorage.setItem('cc_c',JSON.stringify(chars))}catch(e){showErr('Не удалось сохранить: мало места (фото слишком большое?)')}}
function $(i){return document.getElementById(i)}
function find(id){return chars.find(function(c){return c.id===id})}
function showErr(t){var e=$('err');e.textContent=t;e.classList.toggle('hide',!t)}
function go(v,id){
  view=v;showErr('');
  ['list','chat','edit','set'].forEach(function(x){$(x).classList.toggle('hide',x!==v)});
  $('comp').classList.toggle('hide',v!=='chat');
  $('back').classList.toggle('hide',v==='list');
  $('hEdit').classList.toggle('hide',v!=='chat');
  var c=find(cur);
  $('hAva').classList.toggle('hide',v!=='chat');
  $('title').textContent=v==='chat'&&c?c.name:v==='set'?'Настройки':v==='edit'?'Персонаж':'Персонажи';
  if(v==='chat'&&c){$('hAva').src=c.ava||'';renderChat()}
  if(v==='list')renderList();
  if(v==='set'){$('sUrl').value=S.url;$('sKey').value=S.key;$('sModel').value=S.model;$('sTemp').value=S.temp;$('sMax').value=S.max}
}
function avaHtml(c){return c.ava?'<img class="ava" src="'+c.ava+'" alt="">':'<div class="ava">'+esc((c.name||'?')[0])+'</div>'}
function esc(s){return String(s).replace(/[&<>"]/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]})}
function renderList(){
  var h='';chars.forEach(function(c){
    var last=c.msgs.length?c.msgs[c.msgs.length-1].content:'Пока нет сообщений';
    h+='<div class="row" onclick="openChat(\''+c.id+'\')">'+avaHtml(c)+'<div class="t"><b>'+esc(c.name)+'</b><small>'+esc(last)+'</small></div></div>'});
  $('chars').innerHTML=h||'<p class="hint">Создай первого персонажа.</p>';
}
function openChat(id){cur=id;go('chat')}
function renderChat(){
  var c=find(cur),h='';
  c.msgs.forEach(function(m,i){
    var u=m.role==='user';
    h+='<div class="tools'+(u?' r':'')+'"><button onclick="editMsg('+i+')">изменить</button><button onclick="delMsg('+i+')">удалить</button>'+(!u&&i===c.msgs.length-1?'<button onclick="regen()">заново</button>':'')+'</div><div class="msg '+m.role+'">'+esc(m.content)+'</div>'});
  $('chat').innerHTML=h;$('chat').scrollTop=$('chat').scrollHeight;
}
function editMsg(i){var c=find(cur),t=prompt('Изменить сообщение',c.msgs[i].content);if(t!==null){c.msgs[i].content=t;save();renderChat()}}
function delMsg(i){if(confirm('Удалить сообщение?')){find(cur).msgs.splice(i,1);save();renderChat()}}
function editChar(id){
  var c=id?find(id):null;cur=id;
  $('eName').value=c?c.name:'';$('ePrompt').value=c?c.prompt:'';$('eScen').value=c?c.scen:'';$('eFirst').value=c?c.first:'';
  $('eAva').src=c&&c.ava?c.ava:'';window._ava=c?c.ava:'';
  $('eDel').classList.toggle('hide',!c);$('eReset').classList.toggle('hide',!c);
  go('edit');
}
$('eFile').onchange=function(e){
  var f=e.target.files[0];if(!f)return;
  var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){
    var s=Math.min(1,512/Math.max(im.width,im.height)),cv=document.createElement('canvas');
    cv.width=im.width*s;cv.height=im.height*s;cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
    window._ava=cv.toDataURL('image/jpeg',0.82);$('eAva').src=window._ava};im.src=r.result};
  r.readAsDataURL(f)};
function saveChar(){
  var n=$('eName').value.trim();if(!n){alert('Введи имя');return}
  var c=cur?find(cur):null;
  if(!c){c={id:'c'+Date.now(),msgs:[]};chars.unshift(c);cur=c.id}
  c.name=n;c.prompt=$('ePrompt').value;c.scen=$('eScen').value;c.first=$('eFirst').value;c.ava=window._ava||'';
  if(!c.msgs.length&&c.first)c.msgs.push({role:'assistant',content:c.first});
  save();go('chat');
}
function delChar(){if(confirm('Удалить персонажа и чат?')){chars=chars.filter(function(c){return c.id!==cur});cur=null;save();go('list')}}
function resetChat(){if(confirm('Очистить переписку?')){var c=find(cur);c.msgs=c.first?[{role:'assistant',content:c.first}]:[];save();go('chat')}}
function saveSet(){S.url=$('sUrl').value.trim().replace(/\/+$/,'');S.key=$('sKey').value;S.model=$('sModel').value.trim();S.temp=parseFloat($('sTemp').value)||0.9;S.max=parseInt($('sMax').value)||400;save();go(cur?'chat':'list')}
function buildMsgs(c){
  var sys='Ты играешь роль персонажа '+c.name+'. Это вымышленная ролевая игра между взрослыми.\n'+c.prompt+(c.scen?'\nСценарий: '+c.scen:'')+'\nНе выходи из роли.';
  return [{role:'system',content:sys}].concat(c.msgs.map(function(m){return{role:m.role,content:m.content}}));
}
async function gen(){
  var c=find(cur);if(busy)return;
  if(!S.url){showErr('Укажи адрес API в настройках (⚙).');return}
  busy=true;showErr('');$('send').textContent='…';
  try{
    var r=await fetch(S.url+'/chat/completions',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},S.key?{Authorization:'Bearer '+S.key}:{}),
      body:JSON.stringify({model:S.model||'default',messages:buildMsgs(c),temperature:S.temp,max_tokens:S.max})});
    if(!r.ok)throw new Error('HTTP '+r.status);
    var d=await r.json();c.msgs.push({role:'assistant',content:d.choices[0].message.content.trim()});
  }catch(e){showErr('Ошибка запроса: '+e.message+'. Проверь адрес, ключ и доступность сервера.')}
  busy=false;$('send').textContent='▶';save();renderChat();
}
function send(){var t=$('inp').value.trim();if(!t||busy)return;find(cur).msgs.push({role:'user',content:t});$('inp').value='';renderChat();gen()}
function regen(){var c=find(cur);if(c.msgs.length&&c.msgs[c.msgs.length-1].role==='assistant'){c.msgs.pop();gen()}}
$('inp').addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey&&window.innerWidth>700){e.preventDefault();send()}});
load();go('list');
</script>
</body>
</html>
